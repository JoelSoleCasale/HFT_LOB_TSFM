# Default configuration for model training

# Model architecture
model_type: "lstm" # Options: "mlp", "lstm", "transformer"
input_size: 2 # Will be auto-detected from features
hidden_size: 64
num_layers: 2
dropout: 0.2
output_size: 3 # For classification: -1, 0, 1

# Training parameters
batch_size: 32
learning_rate: 0.001
num_epochs: 100
early_stopping_patience: 10
weight_decay: 1e-5

# Data parameters
sequence_length: 10
train_split: 0.8
val_split: 0.1
test_split: 0.1

# Logging and saving
project_name: "financial-models"
experiment_name: null # Will be auto-generated if not provided
log_file: "training.log"
model_save_path: "models/trained_model.pth"
checkpoint_dir: "models/checkpoints"

# Wandb configuration
wandb_enabled: true
wandb_project: "financial-models"
wandb_entity: null
wandb_tags: []

# Device configuration
device: "auto" # Options: "auto", "cpu", "cuda", "mps"
