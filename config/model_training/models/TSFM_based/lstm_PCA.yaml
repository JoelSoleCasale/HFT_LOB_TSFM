data:
  device: "cuda"
  source: "embeddings"
  embedding_code: "chronos2-base_ctx512_seqlast_s5"
  pca_components: 512
  stride: 1

model:
  type: "lstm"
  sequence_length: 100
  hidden_size: 64
  num_layers: 1
  bidirectional: [False, True]
  attention: False
  dropout: 0.2

training:
  mixed_precision: true

logging:
  experiment_name_prefix: "lstm"
