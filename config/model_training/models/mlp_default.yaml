model:
  type: "mlp"
  # String "64,32" means list [64, 32].
  # Use a YAML list of strings ["64", "128,64"] for grid search.
  hidden_sizes: ["", "64", "128", "128,64", "64,32"]
  dropout: 0.2
  sequence_length: 1

data:
  device: "cpu"

logging:
  project_name: "E_pca_mlp_training"
  experiment_name_prefix: "mlp"