model:
  type: "deeplob"
  sequence_length: 100
  conv_filters: 16
  inception_filters: 32
  lstm_hidden_size: 32
  dropout: 0.1

data:
  source: "orderbook"
  levels: 10

  features:
    - name: "deeplob_features"
      params:
        levels: 10

training:
  mixed_precision: true

logging:
  experiment_name_prefix: "deeplob"
