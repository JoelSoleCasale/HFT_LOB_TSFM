# Embedding processing configuration
embedding_type: "chronos" # Type of embedding generator to use

# Embedding-specific configuration
embedding_config:
  model_type: "bolt" # "t5" or "bolt"
  model_size: "mini" # "mini", "small", "base", "large"
  seq_aggregation: "last" # "last" or "mean" - aggregation across sequence dimension
  feat_aggregation: "concat" # "concat" or "mean" - aggregation across features
  augment_with_statistics: true # Whether to augment embeddings with k-patch statistics
  k: 8 # Number of patches for statistics (if augment_with_statistics=true)
  use_differencing: false # Whether to include differenced embeddings
  device: "cuda" # "cuda" or "cpu"
  batch_size: 32 # Number of samples to process in parallel
  stride: 1 # Generate embeddings only for timestamps where timestamp % stride == 0 (1 = all samples)

# Processing configuration
context_length: 512 # Number of samples to use as context for each embedding

# Feature extraction configuration
feature_extractors:
  - "advanced_orderbook" # List of feature extractors to use (from FeatureExtractorRegistry)

# Orderbook preprocessing
orderbook_levels: 5 # Number of orderbook levels to use
sample_time_delta: 100_000_000 # Time delta for sampling in nanoseconds (100ms)
interpolate: true # Whether to interpolate missing values

# Data configuration
symbol:
  - BTCUSDT
exchange:
  - binance_futures
orderbook_subfolder: "orderbook_snapshots" # Subfolder under data/ containing orderbook files
output_subfolder: "embeddings" # Subfolder under data/ for saving embeddings

# Date range configuration
dates:
  start_date: "2025-07-01"
  end_date: "2025-07-01" # If null, use today's date

# Processing options
overwrite_existing: false # Whether to overwrite existing embedding files

